[project]
name = "simplchat"
version = "0.1.0"
description = "An end-to-end encrypted chat application"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "cryptography",
    "keyring",
    "keyrings-alt>=5.0.2",
    "websockets>=17.0.1",
]

[project.scripts]
simplchat = "main:main"
simplchat-server = "server:main"
simplchat-web = "web_ui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
